
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🎲 เกมน้ำเต้าปูปลา (Asura's Ransom Edition)</title>

<style>
  /* ******************************************************** */
  /* >>>>>> การแก้ไขเพื่อล็อคหน้าจอ (ห้ามเลื่อน) <<<<<<< */
  /* ******************************************************** */
  html, body {
    width: 100vw;
    height: 100vh;
    overflow: hidden; 
    margin: 0;
    padding: 0;
  }
  /* ******************************************************** */
  
  /* CSS สำหรับพื้นหลังและ Fonts */
  @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@400;700&display=swap');
  body {
    font-family: 'Prompt', sans-serif;
    text-align: center;
    background: linear-gradient(135deg, #a71d31, #3f0d12);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    color: #fff;
    padding: 20px;
    box-sizing: border-box; /* สำคัญ: ป้องกัน Padding เกินขอบเขต */
  }
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  h1 {
    color: gold;
    text-shadow: 0 0 15px rgba(255, 215, 0, 0.8), 0 0 5px rgba(255, 215, 0, 0.5);
    margin-bottom: 20px;
  }
  
  /* CSS สำหรับส่วน Login/Sign-Up */
  .auth-container {
    background: rgba(0, 0, 0, 0.5);
    padding: 30px;
    border-radius: 15px;
    max-width: 400px;
    margin: 50px auto 0px auto; 
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }
  
  /* *** Wrapper for input and eye icon *** */
  .input-wrapper {
      position: relative;
      width: 90%; 
      margin: 10px auto;
      text-align: left;
  }
  
  .auth-container input {
    width: 100%; /* Take full width of wrapper */
    padding: 12px;
    padding-right: 40px; /* Space for the icon */
    margin: 0; 
    border-radius: 8px;
    border: none;
    font-size: 16px;
    box-sizing: border-box;
    background-color: #f9f9f9;
    color: #333;
    box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
  }
  
  /* *** Eye Icon Style *** */
  .toggle-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #666;
      font-size: 18px;
      user-select: none;
      z-index: 10;
  }
  
  .auth-container button {
    display: block;
    width: 90%;
    margin: 15px auto 5px auto;
    padding: 15px 20px;
    border: none;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    font-weight: bold;
    transition: all 0.2s ease-out;
    box-shadow: 
      0 10px 20px rgba(0, 0, 0, 0.5), 
      0 5px 10px rgba(0, 0, 0, 0.3),
      inset 0 -5px 10px rgba(0, 0, 0, 0.3);
    text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.3);
    letter-spacing: 0.5px;
    text-align: center;
    text-decoration: none; 
  }
  #auth-button {
      background: linear-gradient(145deg, #FFDC00, #FF851B);
      color: black;
  }
  .toggle-link {
    color: #ffd700;
    cursor: pointer;
    text-decoration: none;
    margin-top: 15px;
    display: block;
    font-size: 14px;
    transition: 0.1s;
  }
  
  /* CSS สำหรับ Admin Panel */
  #admin-screen {
      display: none;
      max-width: 800px;
      margin: 20px auto;
      background: rgba(0, 0, 0, 0.6);
      padding: 20px;
      border-radius: 15px;
      max-height: calc(100vh - 40px);
      overflow-y: auto;
  }
  #admin-screen h2 {
      color: #33ff33;
      text-shadow: 0 0 8px rgba(51, 255, 51, 0.5);
  }
  .refresh-btn-admin {
      background-color: #007bff; 
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
      margin-bottom: 15px;
      width: 100%;
      max-width: 300px;
  }

  #user-list {
      list-style: none;
      padding: 0;
      text-align: left;
      margin-top: 20px;
  }
  #user-list li {
      background: rgba(255, 255, 255, 0.1);
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
  }
  .user-info strong {
      color: #FFDC00; 
      font-size: 1.1em;
      text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
  }
  .user-info {
      font-weight: bold;
      color: #fff;
      min-width: 150px;
  }
  .user-balance {
      color: #FFDC00;
      margin-right: 20px;
  }
  .admin-controls {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-top: 10px;
  }
  .admin-controls input[type="number"] {
      padding: 8px;
      width: 80px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      color: #333;
  }
  .admin-controls button {
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.1s;
  }
  .deposit-btn-admin { background-color: #33ff33; color: black; }
  .withdraw-btn-admin { background-color: #ff4136; color: white; }
  .logout-btn-admin { background-color: #ccc; color: black; margin-top: 20px; width: 100%; max-width: 200px; display: block; margin-left: auto; margin-right: auto; }

  /* ************************************************* */
  /* >>>>>> CSS สำหรับหน้าเกม (แก้ไข No Scroll) <<<<<< */
  /* ************************************************* */
  #game-screen { 
    display: none; /* ถูกควบคุมโดย JavaScript */
    /* *** การแก้ไขหลัก: ใช้ Flexbox เพื่อจัดการการจัดวาง *** */
    height: 100vh; 
    box-sizing: border-box;
    padding: 10px; /* ลด Padding โดยรวม */
    overflow: hidden; /* สำคัญ: ปิดการเลื่อน (Scroll) โดยสิ้นเชิง */
    display: flex; 
    flex-direction: column; 
    justify-content: space-between; /* กระจายองค์ประกอบให้เต็มพื้นที่แนวตั้ง */
  }
  
  #balance {
    background: rgba(255,255,255,0.2);
    display: inline-block;
    padding: 10px 20px;
    border-radius: 25px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    font-size: 18px;
    margin-bottom: 10px; /* ลด Margin */
    font-weight: bold;
    color: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #balance button {
    margin-left: 10px; 
    padding: 5px 10px; 
    border: none; 
    border-radius: 5px; 
    cursor: pointer; 
    font-weight: bold; 
    transition: 0.1s;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
  }
  .logout-btn { background: #c30000; color: white; }
  .refresh-btn { background: #007bff; color: white; }
  
  /* NEW: สำหรับปุ่มบริการ (เติมเงิน/ถอนเงิน) */
  .service-buttons {
      margin-bottom: 10px; /* ลด Margin */
      margin-top: -5px; 
  }
  .service-btn {
      display: inline-block;
      padding: 12px 25px;
      border-radius: 30px;
      font-size: 18px;
      font-weight: bold;
      text-decoration: none;
      color: white;
      cursor: pointer;
      transition: all 0.2s ease-out;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
      border: 2px solid white;
  }
  .service-line-btn {
      background: linear-gradient(145deg, #00C300, #3CFF3C); 
      color: black;
      border-color: #3CFF3C;
  }
  
  /* Layout สำหรับปุ่มเดิมพันทั้งหมด */
  .betting-area {
      flex-shrink: 1; /* อนุญาตให้หดได้เพื่อไม่ให้เกิด Scroll */
      max-width: 500px;
      margin: 10px auto; /* ลด Margin */
      overflow-y: hidden; /* ปิดการเลื่อนภายในด้วย */
  }
  
  /* ปุ่มเดิมพันเดี่ยว (Single Bets) */
  .single-bets {
    display: grid; 
    grid-template-columns: repeat(3, 1fr); 
    gap: 10px; /* ปรับลดระยะห่างระหว่างปุ่ม */
    margin-bottom: 10px; 
  }
  
  /* *** การแก้ไขหลัก: ปรับขนาดปุ่มแทงเดี่ยวให้เล็กลง *** */
  .bet-btn-base {
    width: 100%; 
    height: 70px; /* กำหนดความสูงคงที่ (เทียบเท่าปุ่มสูง/ต่ำ) */
    padding-top: 0; /* ลบ padding-top: 100% ออก */
    position: relative;
    
    /* ใช้ Flexbox จัดกลาง Emoji */
    display: flex;
    justify-content: center;
    align-items: center;
    
    font-size: 35px; /* ลดขนาด Emoji */
    border-radius: 15px; /* ปรับมุมมนให้เล็กลง */
    cursor: pointer;
    box-sizing: border-box;
  }
  
  /* *** CSS ที่เพิ่มเข้ามา: สำหรับรูปภาพในปุ่มเดิมพันสัตว์ *** */
  .bet-btn-single img {
      width: 50px; /* กำหนดขนาดรูปภาพตามที่ร้องขอ */
      height: 50px;
      object-fit: contain; /* ป้องกันรูปภาพเสียสัดส่วน */
  }
  /* ************************************************* */

  
  /* ปุ่มเดิมพันรวม (Compound Bets) */
  .compound-bets {
      display: flex;
      justify-content: space-between;
      gap: 10px; 
      margin-top: 5px;
      margin-bottom: 10px;
  }
  
  /* CSS สำหรับปุ่มสูง/ต่ำ/ตอง (เพื่อให้ขนาดเข้ากัน) */
  .bet-btn-compound {
      padding: 10px 5px; 
      font-size: 14px;
      font-weight: bold;
      border-radius: 8px;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
      min-height: 50px; /* กำหนดความสูงขั้นต่ำเพื่อให้ขนาดใกล้เคียง */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
  }
  .bet-high { background: linear-gradient(to top, #ff4136, #ff725e); color: white; border: 2px solid #ff725e; }
  .bet-low { background: linear-gradient(to top, #0074D9, #4192d9); color: white; border: 2px solid #4192d9; }
  .bet-triple-any { background: linear-gradient(to top, #FFDC00, #FFE033); color: black; border: 2px solid #FFE033; }
  .bet-btn-compound.selected { transform: scale(1.05); border: 4px solid white; box-shadow: 0 0 15px rgba(255, 255, 255, 0.7); }

  /* CSS สำหรับปุ่มเดิมพันเดี่ยว */
  .bet-btn-single {
      background: linear-gradient(to top, #2ECC40, #3CFF53);
      color: white;
      border: 2px solid #3CFF53;
  }
  .bet-btn-single.selected { transform: scale(1.05); border: 4px solid white; box-shadow: 0 0 15px rgba(255, 255, 255, 0.7); }


  .bet-control { margin-bottom: 15px; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 10px; }
  
  /* *** CSS ที่เพิ่มเข้ามา: สำหรับปุ่มจำนวนเงินแทน Input *** */
  .amount-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
      width: 100%;
      max-width: 400px;
      margin: 0 auto 10px auto;
  }

  .amount-btn-select {
      flex-basis: 30%; /* จัดให้มี 3 ปุ่มต่อแถว */
      padding: 10px 5px;
      background: linear-gradient(to right, #007bff, #0056b3);
      color: white;
      border: 1px solid #0056b3;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
      font-size: 14px;
  }

  .amount-btn-select.active {
      background: linear-gradient(to right, #28a745, #1e7e34);
      border: 2px solid gold;
      transform: scale(1.05);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.7);
  }
  
  .bet-control label {
      margin-right: 0;
      width: 100%;
      text-align: center;
      margin-bottom: 5px;
  }
  
  /* ซ่อน Input เดิม และปุ่มเดิมพันสูงสุด เพราะเปลี่ยนเป็นปุ่มเลือกจำนวนเงินแล้ว */
  .bet-input-group {
      display: none; 
  }
  
  /* ************************************************* */
  
  button#roll {
    /* ใช้ margin-top: auto; ใน #game-screen (Flexbox) เพื่อดันปุ่มลงด้านล่าง */
    background: gold;
    color: black;
    padding: 18px 40px;
    border-radius: 20px;
    font-size: 22px;
    font-weight: bold;
    cursor: pointer;
    border: none;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
    transition: 0.1s;
    margin-top: 10px; /* ให้มีระยะห่างกับส่วนควบคุมเดิมพัน */
  }
  #roll:disabled {
      background: #ccc;
      cursor: not-allowed;
      box-shadow: none;
  }
  .dice { font-size: 60px; margin: 10px 0; /* ลด Margin */ text-shadow: 0 0 10px rgba(255,255,255,0.5); }
  .result { margin-top: 10px; font-size: 24px; color: #33ff33; text-shadow: 0 0 15px #33ff33, 0 0 5px #33ff33; font-weight: bold; }
  
  /* Responsive Design */
  @media (max-width: 600px) {
    body { padding: 5px; } /* ลด Padding ของ Body */
    
    #game-screen {
        padding: 5px; /* ลด padding ลงอีกสำหรับมือถือ */
    }

    h1 { margin-top: 5px; margin-bottom: 5px; font-size: 20px; } 
    #balance { margin-bottom: 8px; padding: 8px 15px; font-size: 16px; } 
    .service-buttons { margin-bottom: 8px; margin-top: 0px; } 
    .service-btn { padding: 8px 15px; font-size: 14px; }
    
    .single-bets { gap: 5px; margin-bottom: 8px; } /* ลด Gap ลงอีก */
    
    /* *** การแก้ไขหลักสำหรับมือถือ: ปรับขนาดปุ่มแทงเดี่ยว *** */
    .bet-btn-base { 
        font-size: 25px; 
        height: 50px; /* เล็กลงสำหรับมือถือ */
        border-radius: 10px;
    }
    .bet-btn-single img { /* ปรับขนาดรูปภาพในมือถือ */
        width: 40px; 
        height: 40px;
    }
    /* **************************************** */
    .amount-btn-select {
        font-size: 12px;
        padding: 8px 3px;
    }
    .amount-buttons {
        max-width: 300px;
    }

    .betting-area { margin: 5px auto; } 

    .compound-bets { gap: 5px; margin-top: 5px; margin-bottom: 8px; }
    .bet-btn-compound { padding: 6px 3px; font-size: 12px; min-height: 40px; }

    .bet-control { 
      flex-direction: column; 
      gap: 5px; 
      margin-bottom: 8px;
    }
    .bet-control label { font-size: 14px; }
    
    button#roll { padding: 10px 20px; font-size: 16px; }
    .dice { font-size: 40px; margin: 5px 0; } 
    .result { margin-top: 5px; font-size: 18px; }
    
    #admin-screen { padding: 10px; }
  }
</style>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>
</head>
<body>
    
  <div id="auth-screen" style="display:none;">
    <h1>เข้าสู่ระบบ / สมัครสมาชิก 🎯</h1>
    
    <form class="auth-container" onsubmit="handleAuth(event); return false;" novalidate>
      <h2 id="auth-title">เข้าสู่ระบบ</h2>
      
      <div class="input-wrapper">
          <input type="tel" id="phone" placeholder="เบอร์โทรศัพท์" required>
      </div>
      <div class="input-wrapper">
          <input type="password" id="password" placeholder="รหัสผ่านที่คุณกำหนดเอง" required>
          <span class="toggle-password" onclick="togglePasswordVisibility('password', this)">👁️</span>
      </div>
      
      <div id="signup-fields" style="display:none;">
          <div class="input-wrapper">
              <input type="password" id="confirmPassword" placeholder="ยืนยันรหัสผ่าน" required>
              <span class="toggle-password" onclick="togglePasswordVisibility('confirmPassword', this)">👁️</span>
          </div>
          <div class="input-wrapper">
              <input type="text" id="gameUsername" placeholder="ชื่อผู้ใช้ที่จะแสดงในเกม" required>
          </div>
      </div>

      <button id="auth-button" type="submit">เข้าสู่ระบบ</button>
      <p id="error-message" style="color: red; margin-top: 10px; font-size: 14px;"></p>
      
      <a class="toggle-link" onclick="toggleAuthMode()">ยังไม่มีบัญชี? สมัครสมาชิกที่นี่</a>
    </form>

    <div class="service-buttons" style="margin-top: 30px;">
        <p style="font-size: 14px; margin-bottom: 5px; color: #f0f0f0;">ปัญหาการเข้าสู่ระบบ/ลืมรหัสผ่าน</p>
        <button onclick="openLineOAPopup()" class="service-btn service-line-btn" style="padding: 10px 20px; font-size: 16px;">
            📞 ติดต่อแอดมิน (Line OA)
        </button>
    </div>

  </div>
  
  <div id="admin-screen">
      <h2>🛠️ แผงควบคุมผู้ดูแลระบบ</h2>
      
      <button onclick="renderUserList()" class="refresh-btn-admin">
          🔄 รีเฟรชรายชื่อผู้เล่น
      </button>

      <ul id="user-list">
          </ul>
      
      <button onclick="adminLogout()" class="logout-btn-admin">ออกจากระบบแอดมิน</button>
  </div>
  
  <div id="game-screen">
    <h1>🎲 เกมน้ำเต้าปูปลา 🎲</h1>
    
    <div class="service-buttons">
        <button onclick="openLineOAPopup()" class="service-btn service-line-btn">
            💸 เติมเงิน/ถอนเงิน (Line OA)
        </button>
    </div>
    
    <div id="balance">
        💰 <span id="usernameDisplay">ยอดเงิน:</span> <span id="playerBalance">0</span> บาท
        <button onclick="forceRefresh()" class="refresh-btn">🔄</button>
        <button onclick="logout()" class="logout-btn">ออกจากระบบ</button>
    </div>

    <div class="betting-area">
        <p>แทงเดี่ยว (จ่าย 1-3 เท่า):</p>
        <div class="single-bets">
            <button class="bet-btn-base bet-btn-single" data-bet-type="single" data-bet-value="น้ำเต้า">
                <img src="images/gourd.png" alt="น้ำเต้า">
            </button>
            <button class="bet-btn-base bet-btn-single" data-bet-type="single" data-bet-value="ปู">
                <img src="images/crab.png" alt="ปู">
            </button>
            <button class="bet-btn-base bet-btn-single" data-bet-type="single" data-bet-value="ปลา">
                <img src="images/fish.png" alt="ปลา">
            </button>
            <button class="bet-btn-base bet-btn-single" data-bet-type="single" data-bet-value="เสือ">
                <img src="images/tiger_face.png" alt="เสือ">
            </button>
            <button class="bet-btn-base bet-btn-single" data-bet-type="single" data-bet-value="ไก่">
                <img src="images/chicken.png" alt="ไก่">
            </button>
            <button class="bet-btn-base bet-btn-single" data-bet-type="single" data-bet-value="กุ้ง">
                <img src="images/shrimp.png" alt="กุ้ง">
            </button>
            </div>

        <p>แทงรวม (สูง/ต่ำ, ตอง):</p>
        <div class="compound-bets">
            <button class="bet-btn-compound bet-high" data-bet-type="high_low" data-bet-value="High">
                สูง (11-17)<br>จ่าย 1:1
            </button>
            <button class="bet-btn-compound bet-low" data-bet-type="high_low" data-bet-value="Low">
                ต่ำ (4-10)<br>จ่าย 1:1
            </button>
            <button class="bet-btn-compound bet-triple-any" data-bet-type="triple_any" data-bet-value="Any">
                ตอง (ออก 3 เหมือนกัน)<br>จ่าย 7:1
            </button>
        </div>
    </div>

// ===============================================
// 3. User Authentication (ปรับปรุงการจัดการ Submit และ Error)
// ===============================================
async function handleAuth(event) {
    // *** แก้ไข: ป้องกันการส่งฟอร์มมาตรฐานของเบราว์เซอร์ ***
    if (event) {
        event.preventDefault(); 
    }

    // *** แก้ไข: เปลี่ยนจาก email เป็น phone ***
    const phone = document.getElementById('phone').value.trim();
    // ****************************************
    const password = document.getElementById('password').value;
    const errorMessage = document.getElementById('error-message');
    errorMessage.textContent = ''; 
    
    // ตั้งค่าปุ่มเป็นสถานะกำลังโหลด
    const authButton = document.getElementById('auth-button');
    authButton.textContent = 'กำลังดำเนินการ...';
    authButton.disabled = true;

    // *** แก้ไข: ตรวจสอบ Phone/Email Validation ***
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    // ใช้ Phone เป็น User ID ใน Firestore แต่ต้องใช้ email สำหรับ Firebase Auth
    const authEmail = isLoginMode ? phone + "@phone.com" : phone + "@phone.com"; 

    // ตรวจสอบเบอร์โทร: ต้องเป็นตัวเลขเท่านั้น
    if (!/^\d+$/.test(phone)) {
        errorMessage.textContent = '❌ รูปแบบเบอร์โทรศัพท์ไม่ถูกต้อง (ต้องเป็นตัวเลขเท่านั้น)';
    }

    if (!phone || !password) {
        errorMessage.textContent = 'กรุณากรอกเบอร์โทรศัพท์และรหัสผ่านให้ครบถ้วน';
    }
    
    // Admin Login ยังใช้ Email/Pass เดิม (สำหรับ Hardcoded Admin)
    if (phone === ADMIN_EMAIL && password === ADMIN_PASS) {
        adminLoginSuccess();
        return;
    }
    
    if (errorMessage.textContent !== '') {
        authButton.textContent = isLoginMode ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก';
        authButton.disabled = false;
        return;
    }
    
    try {
        await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        if (isLoginMode) {
            // *** แก้ไข: ใช้ authEmail สำหรับ Firebase Auth ***
            await auth.signInWithEmailAndPassword(authEmail, password);
            
            // ล้างช่องกรอกหลังจากเข้าสู่ระบบสำเร็จ
            document.getElementById('phone').value = '';
            document.getElementById('password').value = '';
            
            // ใช้ phone number เป็น ID สำหรับ loginSuccess
            loginSuccess(phone, auth.currentUser.uid); 
        } else {
            // SIGN UP Logic (with 12-char password check)
            const confirmPassword = document.getElementById('confirmPassword').value;
            const gameUsername = document.getElementById('gameUsername').value.trim();
            
            if (!gameUsername || gameUsername.length < 3 || gameUsername.length > 20) {
                 errorMessage.textContent = 'ชื่อผู้ใช้ในเกมต้องมี 3-20 ตัวอักษร';
            }
            
            if (password.length < 12) { 
                errorMessage.textContent = 'รหัสผ่านต้องมีความยาวอย่างน้อย 12 ตัวอักษร'; 
            }

            if (password !== confirmPassword) {
                errorMessage.textContent = 'รหัสผ่านและยืนยันรหัสผ่านไม่ตรงกัน';
            }
            
            // *** แก้ไข: ตรวจสอบว่าเบอร์โทรศัพท์นี้ถูกใช้แล้วหรือยัง (ใน Firestore) ***
            const existingUserPhone = await db.collection(HOO_HEY_HOW_COLLECTION).doc(phone).get();
            if (existingUserPhone.exists) {
                errorMessage.textContent = '❌ เบอร์โทรศัพท์นี้ถูกใช้ลงทะเบียนแล้ว! กรุณาเข้าสู่ระบบ หรือใช้เบอร์อื่น';
            }
            // *************************************************************************
            
            const existingUsernames = await db.collection(HOO_HEY_HOW_COLLECTION).where('displayName', '==', gameUsername).get();
            if (!existingUsernames.empty) {
                errorMessage.textContent = '❌ ชื่อผู้ใช้นี้มีคนใช้แสดงในเกมแล้ว! กรุณาเลือกชื่ออื่น';
            }
            
            if (errorMessage.textContent !== '') {
                 authButton.textContent = 'สมัครสมาชิก';
                 authButton.disabled = false;
                 return;
            }

            // *** แก้ไข: ใช้ authEmail สำหรับ Firebase Auth ***
            const userCredential = await auth.createUserWithEmailAndPassword(authEmail, password);
            const user = userCredential.user;

            // *** โค้ดที่แก้ไข: เพิ่มการหน่วงเวลาเพื่อแก้ปัญหา Permissions ***
            // หน่วงเวลา 300 มิลลิวินาที เพื่อให้ Auth Token พร้อมใช้สำหรับการเขียน Firestore
            await new Promise(resolve => setTimeout(resolve, 300)); 
            // *************************************************************

            // *** แก้ไข: ใช้ phone เป็น Doc ID ใน Firestore ***
            await db.collection(HOO_HEY_HOW_COLLECTION).doc(phone).set({
                phone: phone, 
                displayName: gameUsername, 
                balance: 0,
                uid: user.uid 
            });
            // *************************************************

            alert('สมัครสมาชิกสำเร็จ! กรุณาเข้าสู่ระบบอีกครั้ง'); 
            toggleAuthMode();
        }
        
    } catch (error) {
        // *** แก้ไข: พิมพ์ error เต็มใน Console สำหรับ Debug ***
        console.error("Firebase Auth Error Details:", error); 
        
        let displayError = 'เกิดข้อผิดพลาดที่ไม่ทราบสาเหตุ กรุณาติดต่อแอดมิน';

        if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
            displayError = '❌ เบอร์โทรศัพท์หรือรหัสผ่านไม่ถูกต้อง กรุณาตรวจสอบอีกครั้ง';
        } else if (error.code === 'auth/email-already-in-use') {
            displayError = '❌ เบอร์โทรศัพท์นี้มีคนใช้แล้ว! กรุณาลองเข้าสู่ระบบ หรือใช้เบอร์อื่น';
        } else if (error.code === 'auth/weak-password') {
            displayError = 'รหัสผ่านอ่อนแอเกินไป (ต้องมีอย่างน้อย 12 ตัวอักษร)';
        } else if (error.code === 'auth/operation-not-allowed') {
            displayError = '⚠️ ระบบการลงทะเบียนถูกปิดใช้งาน! กรุณาแจ้งแอดมินให้เปิดใช้งาน "Email/Password" ใน Firebase Console';
        } else if (error.code === 'auth/invalid-email') {
             displayError = 'รูปแบบเบอร์โทรศัพท์ที่ใช้ในการลงทะเบียนไม่ถูกต้อง';
        } else if (error.message.includes('permission')) {
             // หากเกิด Error "Missing or insufficient permissions" ในขั้นตอน Set
             displayError = '❌ ข้อผิดพลาดสิทธิ์: โปรดตรวจสอบว่าคุณได้กด "Publish" กฎ Firestore Rules ที่ถูกต้องแล้ว';
        } else {
            displayError = `เกิดข้อผิดพลาด: ${error.message}`; 
        }
        
        errorMessage.textContent = displayError;
        
    } finally {
        // คืนค่าปุ่มเข้าสู่ระบบเสมอ
        authButton.textContent = isLoginMode ? 'เข้าสู่ระบบ' : 'สมัครสมาชิก';
        authButton.disabled = false;
    }
}

function updateBetControls() {
    // *** แก้ไข: ลบการกำหนดค่า min/max ให้กับ input ที่ถูกลบออกไปแล้ว ***
    const rollButton = document.getElementById('roll');
    if (balance === 0) {
        rollButton.disabled = true;
        rollButton.textContent = '⚠️ เติมเงินเพื่อเริ่มเล่น';
    } else {
        rollButton.disabled = false;
        rollButton.textContent = 'หมุนลูกเต๋า';
    }
    
    // *** เพิ่ม: อัปเดตสถานะปุ่มจำนวนเงิน ***
    const amountButtons = document.querySelectorAll('.amount-btn-select');
    let hasDefaultActive = false;
    
    amountButtons.forEach(btn => {
        const amount = parseInt(btn.dataset.amount);
        btn.classList.remove('active');
        
        // กำหนดปุ่มที่ถูกเลือกปัจจุบันให้เป็น active (ถ้ามีเงินพอ)
        if (amount === selectedBetAmount) {
            if (selectedBetAmount <= balance) {
                 btn.classList.add('active');
                 hasDefaultActive = true;
            } else {
                 // ถ้าเงินไม่พอสำหรับปุ่มที่เคยเลือก ให้รีเซ็ตเป็นค่าต่ำสุด
                 selectedBetAmount = minBet; 
            }
        }
        
        // ปิดปุ่มที่มีมูลค่าสูงกว่ายอดเงินทั้งหมดของผู้เล่น
        btn.disabled = amount > balance; 
    });
    
    // หากปุ่มที่เคยเลือกใช้งานไม่ได้ ให้หาปุ่มที่ใช้งานได้และเลือกใหม่
    if (!hasDefaultActive && balance >= minBet) {
        let bestFit = 0;
        amountButtons.forEach(btn => {
             const amount = parseInt(btn.dataset.amount);
             if (amount <= balance) {
                 bestFit = Math.max(bestFit, amount);
             }
        });
        
        selectedBetAmount = bestFit > 0 ? bestFit : minBet;
        
        amountButtons.forEach(btn => {
             if (parseInt(btn.dataset.amount) === selectedBetAmount) {
                 btn.classList.add('active');
             }
        });
    } else if (balance < minBet) {
        selectedBetAmount = 0;
    }
    // *********************************************
}

async function renderUserList() {
    const userListElement = document.getElementById('user-list');
    userListElement.innerHTML = '';
    
    try {
        const snapshot = await db.collection(HOO_HEY_HOW_COLLECTION).get();
        
        let userCount = 0;
        snapshot.forEach(doc => {
            // *** แก้ไข: ใช้ ID (เบอร์โทร) เป็นตัวหลัก และแสดง phone/email ถ้ามี ***
            const userId = doc.id; 
            const user = doc.data();
            const displayName = user.displayName || userId; 
            const contactInfo = user.phone ? `เบอร์โทร: <strong>${user.phone}</strong>` : `อีเมล: <strong>${user.email}</strong>`; // แสดงตามข้อมูลที่มี

            const listItem = document.createElement('li');
            // *** แก้ไข: ใช้ userId สำหรับ ID ของ Input/Button (เพื่อให้ครอบคลุมทั้ง email และ phone) ***
            const safeId = userId.replace(/[^a-zA-Z0-9]/g, '_');

            listItem.innerHTML = `
                <span class="user-info">ชื่อเกม: <strong>${displayName}</strong></span> 
                <span class="user-info">${contactInfo}</span> 
                <span class="user-balance">ยอดเงิน: ${user.balance} บาท</span>
                <div class="admin-controls">
                    <input type="number" id="amount-${safeId}" placeholder="จำนวนเงิน">
                    <button class="deposit-btn-admin" onclick="updateUserBalance('${userId}')">+ เติมเงิน</button>
                    <button class="withdraw-btn-admin" onclick="updateUserBalance('${userId}', false)">- ถอนเงิน</button>
                </div>
            `;
            userListElement.appendChild(listItem);
            userCount++;
            // ********************************************************************************************
        });

        if (userCount === 0) {
            userListElement.innerHTML = '<li>ไม่มีผู้เล่นในระบบ</li>';
        }

    } catch (error) {
        userListElement.innerHTML = `<li>เกิดข้อผิดพลาดในการโหลดข้อมูล: ${error.message}</li>`;
        console.error("Error loading user list:", error);
    }
}

// *** แก้ไข: ใช้ userId (phone/email) เป็น Doc ID ***
async function updateUserBalance(userId, isDeposit = true) {
    const safeId = userId.replace(/[^a-zA-Z0-9]/g, '_');
    const amountInput = document.getElementById(`amount-${safeId}`);
    const amount = parseInt(amountInput.value);

    if (isNaN(amount) || amount <= 0) {
        alert('กรุณาใส่จำนวนเงินที่ถูกต้อง!');
        return;
    }
    
    const userRef = db.collection(HOO_HEY_HOW_COLLECTION).doc(userId);

    try {
        await db.runTransaction(async (transaction) => {
            const doc = await transaction.get(userRef);
            if (!doc.exists) {
                throw "ไม่พบผู้เล่น";
            }
            
            let currentBalance = doc.data().balance;
            let newBalance;
            const displayName = doc.data().displayName || userId;

            if (isDeposit) {
                newBalance = currentBalance + amount;
            } else {
                if (currentBalance < amount) {
                    throw "ยอดเงินไม่พอ";
                }
                newBalance = currentBalance - amount;
            }
            
            transaction.update(userRef, { balance: newBalance });
            
            if (isDeposit) {
                alert(`เติมเงินให้ ${displayName}: ${amount} บาท ยอดเงินใหม่คือ ${newBalance} บาท`);
            } else {
                alert(`ถอนเงินจาก ${displayName}: ${amount} บาท ยอดเงินใหม่คือ ${newBalance} บาท`);
            }
        });

        renderUserList();
        amountInput.value = ''; 

    } catch (error) {
        if (error === "ยอดเงินไม่พอ") {
            alert(`ยอดเงินไม่เพียงพอสำหรับการถอน ${amount} บาท`);
        } else {
            alert(`เกิดข้อผิดพลาด: ${error}`);
            console.error("Transaction failed: ", error);
        }
    }
}

// *** แก้ไข: ใช้ userId (phone/email) เป็น Doc ID ***
async function getUserBalance(userId) {
    const doc = await db.collection(HOO_HEY_HOW_COLLECTION).doc(userId).get();
    return doc.exists ? doc.data().balance : 0;
}

// ===============================================
// 6. Game Logic Handlers
// ===============================================

const animals = ['น้ำเต้า','ปู','ปลา','เสือ','ไก่','กุ้ง'];
// *** แก้ไข: เปลี่ยน Emojis เป็นชื่อไฟล์รูปภาพ (เพื่อใช้สำหรับ Dice Area) ***
const diceImages = ['<img src="images/gourd.png" style="width: 50px; height: 50px;">','<img src="images/crab.png" style="width: 50px; height: 50px;">','<img src="images/fish.png" style="width: 50px; height: 50px;">','<img src="images/tiger_face.png" style="width: 50px; height: 50px;">','<img src="images/chicken.png" style="width: 50px; height: 50px;">','<img src="images/shrimp.png" style="width: 50px; height: 50px;">'];
// *************************************************************************
const animalValues = { 'น้ำเต้า': 1, 'ปู': 2, 'ปลา': 3, 'เสือ': 4, 'ไก่': 5, 'กุ้ง': 6 };

const activeBets = new Map(); 

const diceArea = document.getElementById('diceArea');
const result = document.getElementById('result');
const rollSound = document.getElementById('rollSound');
const winSound = document.getElementById('winSound');


function updateTotalCostDisplay() {
    // *** แก้ไข: ใช้ selectedBetAmount แทน input value ***
    const amountPerBet = selectedBetAmount;
    // *************************************************
    const totalCost = amountPerBet * activeBets.size;
    document.querySelector('#totalBetDisplay span').textContent = totalCost.toLocaleString();
    
    const rollButton = document.getElementById('roll');
    if (totalCost > balance && balance > 0) {
        rollButton.disabled = true;
        rollButton.textContent = '❌ เงินเดิมพันรวมเกินยอดเงิน!';
    } else if (balance > 0) {
        rollButton.disabled = false;
        rollButton.textContent = 'หมุนลูกเต๋า';
    }
    
    // *** เพิ่ม: อัปเดตสถานะปุ่มจำนวนเงินเมื่อมีการเลือกการเดิมพัน ***
    updateBetControls(); 
    // ************************************************************
}

// *** ลบ setMaxBet() ออกตามคำขอ เนื่องจากไม่มี input แล้ว ***

//     betInput.value = max;
//     updateTotalCostDisplay();

// *** เพิ่ม: Event Listener สำหรับปุ่มจำนวนเงิน ***
const amountButtons = document.querySelectorAll('.amount-btn-select');
amountButtons.forEach(btn => {
    btn.addEventListener('click', function() {
        const amount = parseInt(this.dataset.amount);
        if (amount > balance) {
            alert('ยอดเงินไม่เพียงพอสำหรับการเดิมพันจำนวนนี้');
            return;
        }
        
        amountButtons.forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        selectedBetAmount = amount;
        
        updateTotalCostDisplay();
    });
});
// **********************************************

const bettingButtons = document.querySelectorAll('[data-bet-type]');
bettingButtons.forEach(btn => {
    btn.addEventListener('click', () => {
        const type = btn.dataset.betType;
        const value = btn.dataset.betValue;
        const key = `${type}-${value}`;

        if (activeBets.has(key)) {
            activeBets.delete(key);
            btn.classList.remove('selected');
        } else {
            if (type !== 'single' && (activeBets.has('high_low-High') || activeBets.has('high_low-Low') || activeBets.has('triple_any-Any'))) {
                let conflictingKey = Array.from(activeBets.keys()).find(k => k.startsWith('high_low') || k.startsWith('triple_any'));
                if (conflictingKey) {
                    activeBets.get(conflictingKey).classList.remove('selected');
                    activeBets.delete(conflictingKey);
                }
            }
            
            activeBets.set(key, btn);
            btn.classList.add('selected');
        }
        
        updateTotalCostDisplay(); 
    });
});


// ===============================================
// 7. โค้ด Roll Dice พร้อม Transaction 
// ===============================================

document.getElementById('roll').addEventListener('click', async () => {
    // *** แก้ไข: ใช้ selectedBetAmount แทน input value ***
    const currentBetAmount = selectedBetAmount; 
    // *************************************************
    
    if (activeBets.size === 0) { alert('กรุณาเลือกรูปแบบการเดิมพันอย่างน้อย 1 อย่าง!'); return; }
    
    const totalBetCost = currentBetAmount * activeBets.size;
    
    if (totalBetCost === 0) {
        alert('กรุณาเลือกจำนวนเงินเดิมพัน!');
        return;
    }

    if (totalBetCost > balance) { 
        alert(`ยอดเงินไม่เพียงพอสำหรับการเดิมพันทั้งหมด ${totalBetCost} บาท!`); 
        updateBetControls(); 
        updateTotalCostDisplay();
        return; 
    }

    // ************ การเตรียม UI ก่อน Transaction ************
    balance -= totalBetCost;
    balanceDisplay.textContent = balance;
    diceArea.textContent = 'หมุน...';
    result.textContent = '';
    rollSound.currentTime = 0;
    rollSound.play();
    document.getElementById('roll').disabled = true; 

    try {
        // ************ 1. บันทึกยอดเงินที่ถูกหักลงใน Firestore ด้วย Transaction ************
        await db.runTransaction(async (transaction) => {
            // *** แก้ไข: ใช้ currentPhone แทน currentEmail ***
            const userRef = db.collection(HOO_HEY_HOW_COLLECTION).doc(currentPhone); 
            // *************************************************
            const userDoc = await transaction.get(userRef);

            if (!userDoc.exists) {
                throw new Error("ไม่พบข้อมูลผู้เล่นในระบบฐานข้อมูล");
            }
            
            let dbBalance = userDoc.data().balance;
            let newDbBalance = dbBalance - totalBetCost;

            if (newDbBalance < 0) {
                throw new Error("ยอดเงินในฐานข้อมูลไม่พอ (Race Condition)");
            }

            transaction.update(userRef, { balance: newDbBalance });
            balance = newDbBalance;
        });

        // ************ 2. ดำเนินการหมุนลูกเต๋าและคำนวณผล (เหมือนเดิม) ************
        setTimeout(async () => { 
            const diceResults = []; 
            const diceValues = []; 
            for (let i = 0; i < 3; i++) {
                const randomIndex = Math.floor(Math.random() * animals.length);
                const animalName = animals[randomIndex];
                diceResults.push(animalName);
                diceValues.push(animalValues[animalName]);
            }
            
            // *** แก้ไข: ใช้ diceImages แทน emojis ***
            diceArea.innerHTML = diceResults.map(name => diceImages[animals.indexOf(name)]).join(' ');
            // ****************************************

            const sum = diceValues.reduce((a, b) => a + b, 0);
            const counts = diceResults.reduce((acc, name) => {
                acc[name] = (acc[name] || 0) + 1;
                return acc;
            }, {});
            
            const isTriple = Object.values(counts).some(count => count === 3);
            const tripleAnimal = isTriple ? diceResults[0] : null;
            const isHigh = sum >= 11 && sum <= 17;
            const isLow = sum >= 4 && sum <= 10;
            
            let totalWinnings = 0;
            let winDetails = [];
            let didWin = false;

            activeBets.forEach((element, key) => {
                const [type, value] = key.split('-');
                let profit = 0;
                let resultMessage = '';

                switch(type) {
                    case 'single':
                        const hitCount = counts[value] || 0;
                        if (hitCount > 0) {
                            profit = currentBetAmount * hitCount; 
                            resultMessage = `ชนะ แทงเดี่ยว ${value} ออก ${hitCount} ตัว (กำไร ${profit} บาท)`;
                        }
                        break;

                    case 'high_low':
                        const betIsHigh = value === 'High';
                        
                        if (isTriple) {
                            resultMessage = `แพ้ ตองออก (สูง/ต่ำ แพ้ทุกกรณี)`;
                        } else if ((betIsHigh && isHigh) || (!betIsHigh && isLow)) {
                            profit = currentBetAmount * 1;
                            resultMessage = `ชนะ แทง ${value} (แต้มรวม ${sum}) (กำไร ${profit} บาท)`;
                        }
                        break;
                    
                    case 'triple_any':
                        if (isTriple) {
                            profit = currentBetAmount * 7; 
                            resultMessage = `ชนะ ตอง ${tripleAnimal} (กำไร ${profit} บาท)`;
                        }
                        break;
                }
                
                if (profit > 0) {
                    totalWinnings += profit;
                    didWin = true;
                    winDetails.push(resultMessage);
                } else if (resultMessage) {
                    winDetails.push(resultMessage);
                }
            });
            
            const totalPayout = totalBetCost + totalWinnings; 
            balance += totalWinnings; 
            
            if (didWin) {
                result.textContent = `🎉 ชนะ! ได้รับเงินคืนทั้งหมด ${totalPayout} บาท (กำไรสุทธิ ${totalWinnings} บาท)\nรายละเอียด: ${winDetails.join(' | ')}`;
                winSound.currentTime = 0;
                winSound.play();
            } else {
                result.textContent = `เสียใจ! ไม่มีรายการเดิมพันที่ชนะ 😢 (เสีย ${totalBetCost} บาท)`;
            }
            
            activeBets.forEach(element => element.classList.remove('selected'));
            activeBets.clear();
            
            // ************ 3. บันทึกยอดเงินสุดท้ายลงใน Firestore ด้วย Transaction ************
            await db.runTransaction(async (transaction) => {
                // *** แก้ไข: ใช้ currentPhone แทน currentEmail ***
                const userRef = db.collection(HOO_HEY_HOW_COLLECTION).doc(currentPhone);
                // *************************************************
                transaction.update(userRef, { balance: balance });
            });
            
            updateBetControls();
            updateTotalCostDisplay(); 
            document.getElementById('roll').disabled = false; 

        }, 900); 

    } catch (error) {
        alert('เกิดข้อผิดพลาดในการบันทึกข้อมูล! ยอดเงินอาจไม่ถูกหัก/เพิ่ม กรุณาลองใหม่');
        
        // *** แก้ไข: ใช้ currentPhone แทน currentEmail ***
        const latestBalance = await getUserBalance(currentPhone); 
        // **********************************************
        balance = latestBalance; 
        
        balanceDisplay.textContent = balance;
        console.error("Game Roll Transaction Failed: ", error);
        document.getElementById('roll').disabled = false;
        updateBetControls();
        updateTotalCostDisplay(); 
        result.textContent = 'เกิดข้อผิดพลาดในการเชื่อมต่อ!';
    }
});


// -----------------------------------------------------
// 🎯🎯🎯 8. การบังคับล็อคอินอัตโนมัติทันทีเมื่อโหลดหน้า (Auto Login) 🎯🎯🎯
// -----------------------------------------------------

async function checkAuthStateAndRoute() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('admin-screen').style.display = 'none';
    document.getElementById('game-screen').style.display = 'none';
    
    // ตรวจสอบ Admin Login (Hardcoded check)
    // *** แก้ไข: ใช้ phone input แทน email input ***
    const phoneInput = document.getElementById('phone');
    // **********************************************
    const passwordInput = document.getElementById('password');
    const adminPhoneCheck = phoneInput ? phoneInput.value.trim() : null;
    const adminPassCheck = passwordInput ? passwordInput.value : null;

    if (adminPhoneCheck === ADMIN_EMAIL && adminPassCheck === ADMIN_PASS) {
        adminLoginSuccess();
        return;
    }

    try {
        const user = auth.currentUser; 
        
        if (user) {
            const authEmail = user.email;
            
            if (authEmail === ADMIN_EMAIL) { 
                adminLoginSuccess();
                return;
            }
            
            // *** แก้ไข: ดึงเบอร์โทรศัพท์จริงจาก Auth Email ***
            // (สมมติว่าเบอร์โทรศัพท์ถูกเข้ารหัสเป็น "1234567890@phone.com")
            let phone = authEmail.split('@')[0];
            
            // ตรวจสอบความถูกต้องของ ID ที่ใช้ใน Firestore (เบอร์โทร/อีเมล)
            const userDoc = await db.collection(HOO_HEY_HOW_COLLECTION).doc(phone).get();
            if (userDoc.exists) {
                 loginSuccess(phone, user.uid);
            } else {
                 // Fallback: อาจจะเป็นผู้ใช้เก่าที่ใช้ email ตรงๆ
                 loginSuccess(authEmail, user.uid);
            }
            
            return;
        }

        // หากไม่พบผู้ใช้ที่ล็อกอินอยู่ ให้แสดงหน้าล็อกอิน
        document.getElementById('auth-screen').style.display = 'block';

    } catch (error) {
        console.error("Auth state check failed:", error);
        document.getElementById('auth-screen').style.display = 'block';
    }
}

// เพิ่ม Listener สำหรับ Back Button
window.addEventListener('popstate', (event) => {
    if (event.state && (event.state.screen === 'game' || event.state.screen === 'admin')) {
        // Do nothing 
    } else {
        // Fallback to Auth screen
        checkAuthStateAndRoute();
    }
});

// Listener สำหรับ window.focus เพื่อช่วยแก้ไขปัญหา Line OA/In-App Logout
window.addEventListener('focus', function() {
    // ตรวจสอบสถานะการล็อกอินทันทีที่หน้าต่างได้รับโฟกัส
    if (auth.currentUser) {
        checkAuthStateAndRoute(); 
    }
});

// เรียกใช้ Auth Check เมื่อโหลดหน้าจอเสร็จแล้ว
document.addEventListener('DOMContentLoaded', () => {
    checkAuthStateAndRoute(); 
});
